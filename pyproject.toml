[project]
name = "omnisectester-core"
version = "1.6.0"
description = "Python scanning engine behind the omnisectester CLI bridge. Stdlib-only v0.1.0."
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
omnisectester-core = "omnisectester.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["omnisectester*"]
